services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ns_net

  postgres_gateway:
    image: postgres:16
    container_name: postgres_gateway
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: gateway_db
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway_pass
    volumes:
      - pg_gateway_data:/var/lib/postgresql/data
      # КОММЕНТИРУЕМ СТРОКУ НИЖЕ, ЧТОБЫ ИЗБЕЖАТЬ ОШИБКИ ПРИ СТАРТЕ БАЗЫ
      # - ../notification-gateway/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ns_net

  notification-gateway:
    build:
      context: ../notification-gateway
      dockerfile: Dockerfile
    container_name: notification-gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres_gateway:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres_gateway
      DB_PORT: 5432
      DB_NAME: gateway_db
      DB_USERNAME: gateway
      DB_PASSWORD: gateway_pass
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: ${RABBITMQ_USER:-guest}
      RABBIT_PASS: ${RABBITMQ_PASS:-guest}
      IDEMPOTENCY_REQUIRED: "true"
      EXCHANGE_NOTIFICATION: "x.notification"
      EXCHANGE_STATUS: "x.notification.status"
      ROUTING_EMAIL: "email"
      ROUTING_TELEGRAM: "telegram"
    networks:
      - ns_net

  whatsapp-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: ${RABBITMQ_USER:-guest}
      RABBIT_PASS: ${RABBITMQ_PASS:-guest}
      QUEUE_IN: "q.notification.whatsapp"
      EXCHANGE_STATUS: "x.notification.status"
      STATUS_ROUTING_KEY: "status.whatsapp"
    networks:
      - ns_net

networks:
  ns_net:
    name: ns_net

volumes:
  pg_gateway_data: