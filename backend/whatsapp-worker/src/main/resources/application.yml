spring:
  application:
    name: whatsapp-worker

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        retry:
          enabled: false

server:
  port: ${SERVER_PORT:8081}

app:
  whatsapp:
    api:
      # Twilio WhatsApp API URL
      base-url: https://api.twilio.com/2010-04-01/Accounts/AC4a0e9d8445e0e4ab389e984268d2af83/Messages.json

      # ВАШ ПРАВИЛЬНЫЙ ТОКЕН (тот что вы сгенерировали):
      token: Basic QUM0YTBlOWQ4NDQ1ZTBlNGFiMzg5ZTk4NDI2OGQyYWY4Mzo5OTFkMjQ1YWYzYjc0NGU1MzRjYWU5YzJlYWU0ZDNhYg==
      from-number: "whatsapp:+14155238886"  # ← ДОБАВЬТЕ ЭТО
      timeout-ms: 30000
      max-retries: 3

    queue:
      name: q.notification.whatsapp  # ← должно совпадать с именем очереди
      dlq: ns.whatsapp.dlq

    retry:
      delays: [ "5s", "30s", "60s", "300s", "900s" ]

logging:
  level:
    root: INFO
    kg.notifications.whatsapp: DEBUG
    org.springframework.amqp: INFO
    org.springframework.web.client: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %-5level [%thread] %logger{36} - %msg%n"
  file:
    name: logs/whatsapp-worker.log