server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: email-worker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        missing-queues-fatal: false
        acknowledge-mode: manual

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  rabbit:
    exchangeNotification: ${EXCHANGE_NOTIFICATION:x.notification}
    routingEmail: ${ROUTING_EMAIL:email}
    queueEmail: ${QUEUE_EMAIL:q.notification.email}

retry:
  max-attempts: ${RETRY_MAX_ATTEMPTS:5}

logging:
  level:
    root: INFO
    kg.notifications: DEBUG
