server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: email-worker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        missing-queues-fatal: false
        acknowledge-mode: auto

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  rabbit:
    exchangeNotification: ${EXCHANGE_NOTIFICATION:x.notification}
    exchangeStatus: ${EXCHANGE_STATUS:x.notification.status}
    routingEmail: ${ROUTING_EMAIL:email}
    queueEmail: ${QUEUE_EMAIL:q.notification.email}
    queueStatusGateway: ${QUEUE_STATUS_GATEWAY:q.notification.status.gateway}
    emailRetryQueues:
      - ${EMAIL_RETRY_Q1:q.notification.email.retry.15s}
      - ${EMAIL_RETRY_Q2:q.notification.email.retry.60s}
      - ${EMAIL_RETRY_Q3:q.notification.email.retry.300s}
      - ${EMAIL_RETRY_Q4:q.notification.email.retry.900s}
      - ${EMAIL_RETRY_Q5:q.notification.email.retry.3600s}
    emailDlq: ${EMAIL_DLQ:q.notification.email.dlq}

retry:
  max-attempts: ${RETRY_MAX_ATTEMPTS:5}

logging:
  level:
    root: INFO
    kg.notifications: DEBUG
